name: Windows validation and installer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ui
      - run: node scripts/import-smoke.mjs
      - name: Test SQLite in the shipped Electron runtime
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          & ./node_modules/electron/dist/electron.exe ./scripts/electron-sqlite-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
      - name: Build Windows installer (unsigned review artifact)
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Meyar-ERP-2-Windows-Review
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

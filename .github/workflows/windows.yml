name: Windows validation and installer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install the pinned Electron runtime
        run: npm run runtime:install
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ui
      - run: node scripts/import-smoke.mjs
      - name: Test SQLite in the shipped Electron runtime
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          & ./node_modules/electron/dist/electron.exe ./scripts/electron-sqlite-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
      - name: Build Windows installer (unsigned review artifact)
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Validate native Electron window layout
        shell: pwsh
        run: |
          & ./node_modules/electron/dist/electron.exe ./scripts/electron-layout-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Meyar-UI-layout
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Meyar-ERP-2-Windows-Review
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Publish the validated installer for direct download
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-review"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping its installer unchanged."
            exit 0
          fi
          gh run download "$RUN_ID" --name Meyar-ERP-2-Windows-Review --dir installer
          FILE="Meyar-ERP-2-Setup-${VERSION}.exe"
          test -s "installer/$FILE"
          (cd installer && sha256sum "$FILE" > SHA256SUMS.txt)
          gh release create "$TAG" "installer/$FILE" installer/SHA256SUMS.txt \
            --target "$COMMIT_SHA" --prerelease \
            --title "Meyar ERP 2 - Windows ${VERSION}" \
            --notes-file docs/RELEASE.md
